spring.application.name=Bakir Khata
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
server.port=${PORT:8080}
app.finance.service-fee-rate=0.04
app.finance.daily-overdue-rate=0.005
app.finance.max-penalty-rate=0.20
app.finance.platform-penalty-share=0.20
app.otp.mode=${OTP_MODE:demo}
app.otp.fallback-to-demo=true
app.otp.expiry-minutes=2
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=30
